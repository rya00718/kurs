<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - Kurs Mərkəzi Paneli</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <!--Əsas hissə-->
    <main>
        <h1>Giriş</h1>
        <form id="loginForm">
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="E-mailnizi daxil edin" required>
            </div>
            <div>
                <label for="password">Şifrə</label>
                <input type="password" id="password" name="password" placeholder="Şifrənizi daxil edin" required>
                <button type="button" id="togglePassword" aria-controls="password">Şifrəni Göstər</button>
            </div>
            <p id="errorMessage" role="alert" hidden>Şifrənizi düzgün daxil edin</p>
            <button type="submit">Daxil ol</button>
        </form>
    </main>
    <script src="js/api.js" defer></script>
    <script src="js/ui.js" defer></script>
</body>

</html>
